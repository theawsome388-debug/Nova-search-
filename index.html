<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentro Search — Next-Gen Discovery</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #ffffff;
      --subtext-color: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --input-border: rgba(59, 130, 246, 0.3);
      --shadow-color: rgba(59, 130, 246, 0.2);
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --subtext-color: #64748b;
      --input-border: rgba(59, 130, 246, 0.4);
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    /* Top Controls */
    .top-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
    }

    .theme-toggle, .history-btn {
      background: var(--card-bg);
      border: 1px solid var(--input-border);
      color: var(--text-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    .logo {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .tagline {
      color: var(--subtext-color);
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    /* Filter Tabs */
    .filters {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .filter-tab {
      background: none;
      border: none;
      color: var(--subtext-color);
      cursor: pointer;
      font-weight: 600;
      padding: 5px 10px;
      border-bottom: 2px solid transparent;
    }

    .filter-tab.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
    }

    /* Search Container & Autocomplete */
    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--input-border);
      border-radius: 30px;
      padding: 8px 18px;
      box-shadow: 0 10px 25px var(--shadow-color);
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      background: transparent;
      color: var(--text-color);
      padding: 8px 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
    }

    .icon-btn:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--input-border);
      border-radius: 16px;
      margin-top: 8px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: none;
      text-align: left;
    }

    .suggestion-item {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 15px;
      color: var(--text-color);
    }

    .suggestion-item:hover {
      background: rgba(59, 130, 246, 0.15);
    }

    /* Action Buttons */
    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .search-btn {
      background: var(--accent-blue);
      color: white;
    }

    .ai-btn {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Modal / Answer Box for AI */
    .ai-response-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .ai-response-content {
      background: var(--card-bg);
      border: 1px solid var(--input-border);
      width: 100%;
      max-width: 650px;
      border-radius: 20px;
      padding: 25px;
      text-align: left;
      position: relative;
      max-height: 80vh;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 24px;
      cursor: pointer;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="history-btn" onclick="showHistory()">📜 History</button>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Theme</button>
  </div>

  <div class="container">
    <div class="logo">Zentro</div>
    <div class="tagline">Search Smarter. Discover Faster.</div>

    <!-- Category Filter Tabs -->
    <div class="filters">
      <button class="filter-tab active" onclick="setCategory('web', this)">All</button>
      <button class="filter-tab" onclick="setCategory('isch', this)">Images</button>
      <button class="filter-tab" onclick="setCategory('nws', this)">News</button>
      <button class="filter-tab" onclick="setCategory('vid', this)">Videos</button>
    </div>

    <!-- Search Input Block -->
    <div class="search-wrapper">
      <div class="search-box">
        <input id="query" type="text" placeholder="Search anything... (Ctrl+Enter for AI)" autocomplete="off">
        <button class="icon-btn" title="Voice Search" onclick="voiceSearch()">🎤</button>
      </div>
      <div id="suggestions" class="suggestions-list"></div>
    </div>

    <!-- Action Controls -->
    <div class="buttons">
      <button class="btn search-btn" onclick="searchWeb()">Web Search</button>
      <button class="btn ai-btn" id="aiBtn" onclick="aiSearch()">
        <span id="aiBtnText">✨ AI Answer</span>
      </button>
    </div>
  </div>

  <!-- Modal Display Window for AI Search -->
  <div id="aiModal" class="ai-response-modal">
    <div class="ai-response-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h3 style="margin-top:0; color: var(--accent-purple);">🤖 Zentro AI Insights</h3>
      <hr style="border-color: var(--input-border); margin-bottom: 15px;">
      <div id="aiOutputText">Generating response...</div>
    </div>
  </div>

<script>
  let activeCategory = 'web';

  // Keyboard Shortcuts & Autocomplete Handler
  const queryInput = document.getElementById("query");
  const suggestionsBox = document.getElementById("suggestions");

  queryInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      if (e.ctrlKey || e.metaKey) {
        aiSearch();
      } else {
        searchWeb();
      }
    }
  });

  queryInput.addEventListener("input", async () => {
    const val = queryInput.value.trim();
    if (val.length < 2) {
      suggestionsBox.style.display = "none";
      return;
    }

    // JSONP fetch workaround for Google Live Suggestions API
    const script = document.createElement("script");
    script.src = `https://suggestqueries.google.com/complete/search?client=chrome&q=${encodeURIComponent(val)}&callback=handleSuggestions`;
    document.body.appendChild(script);
    document.body.removeChild(script);
  });

  function handleSuggestions(data) {
    const suggestions = data[1];
    if (!suggestions || suggestions.length === 0) {
      suggestionsBox.style.display = "none";
      return;
    }

    suggestionsBox.innerHTML = suggestions.slice(0, 5).map(item => 
      `<div class="suggestion-item" onclick="selectSuggestion('${item}')">${item}</div>`
    ).join("");
    suggestionsBox.style.display = "block";
  }

  function selectSuggestion(text) {
    queryInput.value = text;
    suggestionsBox.style.display = "none";
    searchWeb();
  }

  // Category Filtering
  function setCategory(cat, el) {
    activeCategory = cat;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }

  // Regular Web Search Execution
  function searchWeb() {
    const q = queryInput.value.trim();
    if (!q) return;

    saveToHistory(q);
    let targetUrl = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
    if (activeCategory !== 'web') {
      targetUrl += `&tbm=${activeCategory}`;
    }
    window.open(targetUrl, '_blank');
  }

  // Real AI API Call using HuggingFace Inference API
  async function aiSearch() {
    const q = queryInput.value.trim();
    if (!q) return;

    saveToHistory(q);
    showModal();
    const outputEl = document.getElementById("aiOutputText");
    outputEl.innerHTML = `<div style="text-align:center; padding:20px;"><div class="spinner"></div><p>Thinking...</p></div>`;

    try {
      const response = await fetch("https://api-inference.huggingface.co/models/Qwen/Qwen2.5-72B-Instruct/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "Qwen/Qwen2.5-72B-Instruct",
          messages: [{ role: "user", content: `Provide a structured, helpful, concise answer to: ${q}` }],
          max_tokens: 300
        })
      });

      const data = await response.json();
      if (data.choices && data.choices[0].message) {
        outputEl.innerText = data.choices[0].message.content;
      } else {
        outputEl.innerText = "Unable to fetch AI response at this moment. Please try again later.";
      }
    } catch (err) {
      outputEl.innerText = "Error connecting to AI search service. Please check your network connection.";
    }
  }

  // Voice Search Functionality
  function voiceSearch() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Voice search is not supported in this browser.");
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    queryInput.placeholder = "Listening...";
    recognition.start();

    recognition.onresult = (event) => {
      queryInput.value = event.results[0][0].transcript;
      queryInput.placeholder = "Search anything...";
      searchWeb();
    };

    recognition.onerror = () => {
      queryInput.placeholder = "Search anything...";
    };
  }

  // Local Storage Search History Manager
  function saveToHistory(term) {
    let history = JSON.parse(localStorage.getItem("zentro_history") || "[]");
    if (!history.includes(term)) {
      history.unshift(term);
      if (history.length > 10) history.pop();
      localStorage.setItem("zentro_history", JSON.stringify(history));
    }
  }

  function showHistory() {
    let history = JSON.parse(localStorage.getItem("zentro_history") || "[]");
    if (history.length === 0) {
      alert("No search history found.");
      return;
    }
    showModal();
    const outputEl = document.getElementById("aiOutputText");
    outputEl.innerHTML = `<h4>Recent Searches</h4><ul>` + 
      history.map(item => `<li style="cursor:pointer; margin-bottom: 6px; color: var(--accent-blue);" onclick="selectSuggestion('${item}'); closeModal();">${item}</li>`).join('') +
      `</ul>`;
  }

  // Theme Toggler
  function toggleTheme() {
    const currentTheme = document.body.getAttribute("data-theme");
    const newTheme = currentTheme === "light" ? "dark" : "light";
    document.body.setAttribute("data-theme", newTheme);
  }

  // Modal Controls
  function showModal() {
    document.getElementById("aiModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("aiModal").style.display = "none";
  }

  // Dismiss suggestions dropdown when clicking outside
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrapper")) {
      suggestionsBox.style.display = "none";
    }
  });
</script>
</body>
</html>
